<!DOCTYPE html>
<html lang="en" th:replace="~{base ::parent(~{::#content}, ~{::title},~{::script})}">
<head>
  <title>Signup Page</title>
</head>
<body> 
  <div id="content" class="pt-16">
   <div class="grid grid-cols-12">
    <div class="col-span-4 md:col-span-2 lg:col-span-3 xl:col-span-4"></div>
    <div class="col-span-12 md:col-span-8 lg:col-span-6 xl:col-span-4">
         <!-- 6 ki space le rahi hai -->
           <!-- card -->
          <div class="block  p-6 border-t-[10px] border-blue-700 bg-white   rounded-xl shadow-sm hover:bg-gray-100 dark:bg-gray-800 dark:border-blue-700 dark:hover:bg-gray-700">
           
            <!-- message here -->
            <div data-th-replace="~{message :: messagebox}"></div>
          <h5 class="mb-2 text-2xl font-bold tracking-tight text-gray-900 dark:text-white">Signup Here</h5>
          <p class="font-normal text-gray-400 dark:text-gray-400">Start managing contacts on cloud...</p>
         
          <form class="mt-4" data-th-action="@{'/do-register'}" method="post" data-th-object="${userForm}" enctype="multipart/form-data">   
              <!--name field  -->
              <div class="mb-2">
               <label for="name" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Name</label>
               <input type="text" id="name" th:field="*{name}" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="Enter here" required />
               <p data-th-if="${#fields.hasErrors('name')}"
                  data-th-errors="*{name}"
                class="text-red-600 px-1 py-0.5"></p> 
              </div>
               
              <!-- email field -->
              <div class="mb-2">
               <label for="email" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Email</label>
               <input type="email" id="email" th:field="*{email}" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="name@flowbite.com" required />
               <p data-th-if="${#fields.hasErrors('email')}"
                  data-th-errors="*{email}"
                class="text-red-600 px-1 py-0.5"></p> 
              </div>

              <!--password field  -->
              <div class="mb-2">
               <label for="password" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">New Password</label>
               <input type="password" id="password" th:field="*{password}" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"  required />
                <p data-th-if="${#fields.hasErrors('password')}"
                  data-th-errors="*{password}"
                class="text-red-600 px-1 py-0.5"></p>  
              </div>

               <!--phone field  -->
              <div class="mb-2">
               <label for="phone" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Contact Number</label>
               <input type="text" id="phone" th:field="*{phoneNumber}" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="Enter here" required />
               <p data-th-if="${#fields.hasErrors('phoneNumber')}"
                  data-th-errors="*{phoneNumber}"
                class="text-red-600 px-1 py-0.5"></p>  
              </div>

             
               <!-- about field -->
                <div class="mb-2">
                 <label for="about" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Write something about yourself</label>
                 <textarea id="about" th:field="*{about}" rows="3" class="block p-2.5 w-full text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="Write here..."></textarea>
                  <p data-th-if="${#fields.hasErrors('about')}"
                  data-th-errors="*{about}"
                class="text-red-600 px-1 py-0.5"></p> 
                </div>

                <div class="mb-4">

    <label for="image_file_input"
           class="block mb-2 text-sm font-medium text-gray-900 dark:text-gray-200">
        Profile Image <span class="text-red-500">*</span>
    </label>

    <input id="image_file_input"
           th:field="*{image}"
           type="file"
           name="image"
           required
           class="block w-full text-sm text-gray-900 dark:text-gray-300
                  border border-gray-300 dark:border-gray-600
                  rounded-lg cursor-pointer
                  bg-white dark:bg-gray-800
                  focus:outline-none

                  file:mr-4 file:py-2 file:px-4
                  file:rounded-l-lg
                  file:border-0
                  file:text-sm file:font-medium
                  file:bg-blue-600 file:text-white
                  hover:file:bg-blue-700">

    <p th:if="${#fields.hasErrors('image')}"
       th:errors="*{image}"
       class="text-red-500 text-sm mt-1"></p>

</div>

                <!-- button -->
                 <div class="mb-2 flex justify-center space-x-3">
                   <button type="submit" class="px-3 py-2 rounded bg-gray-800 text-white dark:bg-blue-700 dark:hover:bg-blue-900 hover:bg-gray-900">Signup</button>
                   <button type="reset" class="px-3 py-2 rounded bg-orange-800 text-white dark:bg-orange-700 dark:hover:bg-orange-900 hover:bg-orange-900">Reset</button>
                 </div>     
          </form>
          </div>
    </div>
   </div>
    
  </div>
  <script>
    console.log("Signup page");
  </script>
</body>
</html>
