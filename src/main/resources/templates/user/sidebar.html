<aside th:fragment="sidebar"
       id="logo-sidebar"
       class="fixed top-0 left-0 z-50 w-64 h-screen
              bg-white dark:bg-gray-900
              border-r border-gray-200 dark:border-gray-700
              transform -translate-x-full lg:translate-x-0
              transition-transform duration-300">

    <div class="h-full flex flex-col justify-between px-3 py-4 overflow-y-auto">

        <!-- 🔵 PROFILE CARD -->
        <div>

            <div class="flex flex-col items-center p-4
                        bg-gray-50 dark:bg-gray-800
                        rounded-xl shadow-sm">

                <img
                    th:src="@{${loggedInUser.profilePic != null ? loggedInUser.profilePic : '/images/default-user.png'}}"
                    class="w-20 h-20 rounded-full object-cover border-2 border-gray-300 dark:border-gray-600"
                    alt="User" />

                <h2 class="mt-3 text-lg font-semibold text-gray-900 dark:text-white"
                    th:text="${loggedInUser.name}">
                    User Name
                </h2>

                <p class="text-xs text-gray-500 dark:text-gray-400"
                   th:text="${loggedInUser.email}">
                    user@gmail.com
                </p>

            </div>

        </div>

        <!-- 📌 MENU -->
        <ul class="mt-6 space-y-2 flex-1">

            <!-- DASHBOARD -->
            <li>
                <a th:href="@{'/user/dashboard'}"
                   class="flex items-center gap-3 p-2 rounded-lg
                          text-gray-700 dark:text-gray-300
                          hover:bg-gray-100 dark:hover:bg-gray-800">

                    <i class="fa-solid fa-gauge"></i>
                    <span>Dashboard</span>
                </a>
            </li>

            <!-- PROFILE -->
            <li>
                <a th:href="@{'/user/profile'}"
                   class="flex items-center gap-3 p-2 rounded-lg
                          text-gray-700 dark:text-gray-300
                          hover:bg-gray-100 dark:hover:bg-gray-800">

                    <i class="fa-solid fa-user"></i>
                    <span>Profile</span>
                </a>
            </li>

            <!-- ADD CONTACT -->
            <li>
                <a th:href="@{'/user/contacts/add'}"
                   class="flex items-center gap-3 p-2 rounded-lg
                          text-gray-700 dark:text-gray-300
                          hover:bg-gray-100 dark:hover:bg-gray-800">

                    <i class="fa-solid fa-user-plus"></i>
                    <span>Add Contact</span>
                </a>
            </li>

            <!-- CONTACTS -->
            <li>
                <a th:href="@{'/user/contacts'}"
                   class="flex items-center gap-3 p-2 rounded-lg
                          text-gray-700 dark:text-gray-300
                          hover:bg-gray-100 dark:hover:bg-gray-800">

                    <i class="fa-solid fa-address-book"></i>
                    <span>Contacts</span>
                </a>
            </li>
 
            <!-- MESSAGES -->
            <li>
                <a href="#"
                   class="flex items-center gap-3 p-2 rounded-lg
                          text-gray-700 dark:text-gray-300
                          hover:bg-gray-100 dark:hover:bg-gray-800">

                    <i class="fa-solid fa-message"></i>
                    <span>Messages</span>
                </a>
            </li>

        </ul>

        <!-- 🔴 LOGOUT -->
        <div class="pt-3 border-t border-gray-200 dark:border-gray-700">

            <a th:href="@{'/logout'}"
               class="flex items-center gap-3 p-2 rounded-lg
                      text-red-600 hover:bg-red-50 dark:hover:bg-gray-800">

                <i class="fa-solid fa-right-from-bracket"></i>
                <span>Logout</span>

            </a>

        </div>

    </div>
</aside>
