<!DOCTYPE html>
<html lang="en" th:replace="~{base ::parent(~{::#content}, ~{::title},~{::script})}">
  <head>
    <title>AddContact</title>
  </head>
  <body> 
    <div id="content">
      <!-- sidebar -->
      <!-- is user logged in : sidebar -->
      <div th:if="${loggedInUser}">
       <div th:replace="~{user/sidebar :: sidebar}"></div>
      </div>

      <div class="lg:pl-64 min-h-screen flex justify-center">
        <div class="w-full max-w-3xl p-6">
          <!-- Card -->
           <div class="bg-white dark:bg-gray-900 p-6 sm:p-8 border border-gray-200 dark:border-gray-700 rounded-2xl shadow-lg hover:shadow-2xl transition duration-300">
            <!-- Message -->
            <div th:replace="~{message::messagebox}"></div> 
             <!--Heading  -->
             <div class="mb-6">
            <h1 class="text-2xl sm:text-3xl font-bold text-gray-800 dark:text-gray-100"> Add New Contact </h1>
            <p class="mt-2 text-sm sm:text-base text-gray-500 dark:text-gray-400">This contact will be stored on cloud, you can direct email this client from scm...</p>
            </div>
            <!-- Form started -->
            <form class="space-y-5" data-th-action="@{'/user/contacts/add'}" data-th-object="${contactForm}" enctype="multipart/form-data" method="post" >
              <!-- contact name -->
              <div>
                <label for="name" class="block mb-2 text-sm font-medium text-gray-700 dark:text-gray-300">Contact Name</label>
                <div class="relative">
                   <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
                     <i class="fa-solid fa-user text-gray-500 dark:text-gray-400"></i>            
                   </div>
                    <input id="name" th:field="*{name}" type="text" autocomplete="name" class="block w-full ps-10 pe-3 py-2.5
                   bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 text-gray-800 dark:text-gray-100
                    text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 placeholder-gray-400 dark:placeholder-gray-500" placeholder="Enter contact name">          
                </div>
                    <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="mt-1 text-sm text-red-500"></p>              
                  </div>

              <!-- contact email -->
              <div>
                <label for="email" class="block mb-2.5 text-sm font-medium text-gray-700 dark:text-gray-300">Contact email</label>
                <div class="relative">
                  <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
                    <i class="fa-solid fa-envelope  text-gray-500 dark:text-gray-400"></i>        
                  </div>
                  <input id="email" th:field="*{email}" type="text"  autocomplete="email" class="block w-full ps-10 pe-3 py-2.5 
                  bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 text-gray-800 dark:text-gray-100 
                  text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 placeholder-gray-400 dark:placeholder-gray-500" placeholder="scm@gmail.com">          
                </div>
                  <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="mt-1 text-sm text-red-500"></p>            
                </div>

              <!-- contact phone number -->
              <div>
                <label for="phoneNumber" class="block mb-2 text-sm font-medium text-gray-700 dark:text-gray-300">Contact Phone</label>
                <div class="relative">
                  <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
                    <i class="fa-solid fa-phone text-gray-500 dark:text-gray-400"></i>         
                  </div>
                  <input id="phoneNumber" th:field="*{phoneNumber}" type="tel" class="block w-full ps-10 pe-3 py-2.5
                                          bg-white dark:bg-gray-800
                                          border border-gray-300 dark:border-gray-600
                                          text-gray-800 dark:text-gray-100
                                          text-sm rounded-lg
                                          focus:ring-blue-500 focus:border-blue-500" placeholder="Enter the Phone number">          
                </div>
                <p th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}" class="mt-1 text-sm text-red-500"> </p>              
              </div>

              <!-- address -->
                <div>            
                  <label for="address"  class="block mb-2 text-sm font-medium text-gray-700 dark:text-gray-300">Contact Address</label>
                  <textarea  th:field="*{address}"  rows="3" class="block w-full px-3 py-2.5
                                         bg-white dark:bg-gray-800
                                         border border-gray-300 dark:border-gray-600
                                         text-gray-800 dark:text-gray-100
                                         text-sm rounded-lg
                                         focus:ring-blue-500 focus:border-blue-500" placeholder="Write your address here...">
                  </textarea>
                  <p th:if="${#fields.hasErrors('address')}" th:errors="*{address}" class="mt-1 text-sm text-red-500"></p>                
                </div>

               <!-- contact discription -->
               <div class="mb-3">            
                  <label for="description" class="block mb-2 text-sm font-medium text-gray-700 dark:text-gray-300">Contact Description</label>
                  <textarea th:field="*{description}"  rows="3" class="block w-full px-3 py-2.5
                                         bg-white dark:bg-gray-800
                                         border border-gray-300 dark:border-gray-600
                                         text-gray-800 dark:text-gray-100
                                         text-sm rounded-lg
                                         focus:ring-blue-500 focus:border-blue-500" placeholder="Write about your contact...">
                  </textarea>
               </div>

               <!-- social-links -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- website link -->
                    <div>
                      <label for="websiteLink" class="block mb-2 text-sm font-medium text-gray-700 dark:text-gray-300">Website</label>
                      <div class="relative">
                        <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
                          <i class="fa-solid fa-earth-americas text-gray-500 dark:text-gray-400"></i>         
                        </div>
                        <input th:field="*{websiteLink}" type="text" class="block w-full ps-10 pe-3 py-2.5
                                              bg-white dark:bg-gray-800
                                              border border-gray-300 dark:border-gray-600
                                              text-gray-800 dark:text-gray-100
                                              text-sm rounded-lg
                                              focus:ring-blue-500 focus:border-blue-500" placeholder="http://scm.com">          
                      </div>
                    </div>
                  
                  
                    <!-- LinkedIn link -->
                    <div>
                      <label for="linkedInLink" class="block mb-2 text-sm font-medium text-gray-700 dark:text-gray-300">LinkedIn</label>
                      <div class="relative">
                        <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
                          <i class="fa-brands fa-linkedin text-gray-500 dark:text-gray-400"></i>      
                        </div>
                        <input th:field="*{linkedInLink}" type="text" class="block w-full ps-10 pe-3 py-2.5
                                              bg-white dark:bg-gray-800
                                              border border-gray-300 dark:border-gray-600
                                              text-gray-800 dark:text-gray-100
                                              text-sm rounded-lg
                                              focus:ring-blue-500 focus:border-blue-500" placeholder="http://linkedin.com">          
                      </div>
                    </div>
                  </div>
                

                <!-- image -->
                 <div>
                    <label class="block mb-2.5 text-sm font-medium text-gray-700 dark:text-gray-300" for="image_file_input">Contact Image</label>
                    <input  th:field="*{contactImage}" id="image_file_input" type="file" 
                      class="block w-full text-sm
                                      text-gray-900 dark:text-gray-300
                                      border border-gray-300 dark:border-gray-600
                                      rounded-lg cursor-pointer
                                      bg-white dark:bg-gray-800
                                      focus:outline-none
                                      file:mr-4 file:py-2 file:px-4
                                      file:rounded-l-lg
                                      file:border-0
                                      file:text-sm file:font-semibold
                                      file:bg-blue-600
                                      file:text-white
                                      hover:file:bg-blue-700
                                      dark:file:bg-gray-700">
                    <img src="" id="upload_image_preview" class="w-40 mt-3 rounded-lg shadow">
                  </div>

                <!-- favourite check box -->
                 <div class="flex items-center">
                    <input th:field="*{favorite}"  type="checkbox" class="w-4 h-4 text-blue-600
                                      bg-white dark:bg-gray-800
                                      border border-gray-300 dark:border-gray-600
                                      rounded focus:ring-2 focus:ring-blue-500">                   
                    <label for="favorite1" class="ms-2 text-sm font-medium text-gray-700 dark:text-gray-300">is this contact is your favourite one ?</label>
                  </div>

                  <div class="flex flex-col sm:flex-row justify-center">
                    <button type="submit" class="px-5 py-2.5
                                       bg-blue-600 hover:bg-blue-700
                                       text-white rounded-lg
                                       transition">Add Contact</button>
                  </div>
           </form>
        </div>
        </div>   
      </div>

      </div>
    

      <script th:src="@{'/js/admin.js'}"></script>
      <script>
        console.log("AddContact page");
     </script>
      <script>
        console.log("second script");
      </script>
  </body>
</html>
