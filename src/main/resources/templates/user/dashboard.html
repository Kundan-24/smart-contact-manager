<!DOCTYPE html>
<html lang="en"
      th:replace="~{base ::parent(~{::#content}, ~{::title},~{::script})}">

<head>
    <title data-th-text="${loggedInUser.name} + ' | SCM Dashboard'">
        Dashboard
    </title>
</head>

<body>

<div id="content">

    <!-- Sidebar -->
    <div th:if="${loggedInUser}">
        <div th:replace="~{user/sidebar :: sidebar}"></div>
    </div>

    <!-- Main Content -->
    <div class="sm:pl-64 min-h-screen bg-gray-100 dark:bg-gray-950">

        <!-- Dashboard Container -->
        <div class="p-4 md:p-6 lg:p-8">

            <!-- Welcome Section -->
            <div class="bg-white dark:bg-gray-900 rounded-2xl shadow-lg border border-gray-200 dark:border-gray-700 p-6">

                <div class="flex flex-col lg:flex-row items-center justify-between gap-6">

                    <!-- Left -->
                    <div class="flex flex-col sm:flex-row items-center gap-5 text-center sm:text-left">

                        <!-- Profile -->
                        <img
                                th:src="${loggedInUser.profilePic}"
                                alt="profile"
                                class="w-24 h-24 rounded-full object-cover border-4 border-blue-500 shadow-md">

                        <!-- Info -->
                        <div>
                            <h1 class="text-3xl md:text-4xl font-bold text-gray-800 dark:text-white">
                                Welcome,
                                <span class="text-blue-600"
                                      th:text="${loggedInUser.name}">
                                </span>
                            </h1>

                            <p class="mt-2 text-gray-600 dark:text-gray-300">
                                Smart Contact Manager Dashboard
                            </p>

                            <div class="mt-3 flex flex-wrap justify-center sm:justify-start gap-2">

                                <span class="px-3 py-1 text-sm rounded-full bg-blue-100 text-blue-700 dark:bg-blue-900 dark:text-blue-300">
                                    SCM User
                                </span>

                                <span
                                        th:classappend="${loggedInUser.emailVarified}
                                        ? 'bg-green-100 text-green-700 dark:bg-green-900 dark:text-green-300'
                                        : 'bg-red-100 text-red-700 dark:bg-red-900 dark:text-red-300'"
                                        class="px-3 py-1 text-sm rounded-full">

                                    <span th:text="${loggedInUser.emailVarified}
                                    ? 'Email Verified'
                                    : 'Not Verified'"></span>
                                </span>

                            </div>
                        </div>
                    </div>

                    <!-- Right -->
                    <div class="text-center">

                        <h2 class="text-lg text-gray-500 dark:text-gray-400">
                            Login Provider
                        </h2>

                        <p class="text-2xl font-bold text-purple-600 mt-1"
                           th:text="${loggedInUser.provider}">
                            SELF
                        </p>

                    </div>

                </div>
            </div>

            <!-- Stats Cards -->
            <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-6 mt-8">

                <!-- Total Contacts -->
                <div class="bg-white dark:bg-gray-900 rounded-2xl shadow-md p-6 border border-gray-200 dark:border-gray-700 hover:shadow-xl transition">

                    <div class="flex justify-between items-center">

                        <div>
                            <p class="text-gray-500 dark:text-gray-400 text-sm">
                                Total Contacts
                            </p>

                            <h2 class="text-4xl font-bold text-blue-600 mt-2"
                                th:text="${totalContacts}">
                                0
                            </h2>
                        </div>

                        <div class="w-16 h-16 rounded-full bg-blue-100 dark:bg-blue-900 flex items-center justify-center">
                            <i class="fa-solid fa-address-book text-2xl text-blue-600"></i>
                        </div>

                    </div>
                </div>

                <!-- Favorite -->
                <div class="bg-white dark:bg-gray-900 rounded-2xl shadow-md p-6 border border-gray-200 dark:border-gray-700 hover:shadow-xl transition">

                    <div class="flex justify-between items-center">

                        <div>
                            <p class="text-gray-500 dark:text-gray-400 text-sm">
                                Favorite Contacts
                            </p>

                            <h2 th:text="${favoriteContacts}" class="text-4xl font-bold text-pink-600 mt-2"> </h2>
                        </div>

                        <div class="w-16 h-16 rounded-full bg-pink-100 dark:bg-pink-900 flex items-center justify-center">
                            <i class="fa-solid fa-heart text-2xl text-pink-600"></i>
                        </div>

                    </div>
                </div>

                <!-- Email -->
                <div class="bg-white dark:bg-gray-900 rounded-2xl shadow-md p-6 border border-gray-200 dark:border-gray-700 hover:shadow-xl transition">

                    <div class="flex justify-between items-center">

                        <div>
                            <p class="text-gray-500 dark:text-gray-400 text-sm">
                                Email Status
                            </p>

                            <h2 class="text-xl font-bold mt-2"
                                th:text="${loggedInUser.emailVarified ? 'Verified' : 'Pending'}"
                                th:classappend="${loggedInUser.emailVarified}
                                ? 'text-green-600'
                                : 'text-red-600'">
                            </h2>
                        </div>

                        <div class="w-16 h-16 rounded-full bg-green-100 dark:bg-green-900 flex items-center justify-center">
                            <i class="fa-solid fa-envelope-circle-check text-2xl text-green-600"></i>
                        </div>

                    </div>
                </div>

                <!-- Provider -->
                <div class="bg-white dark:bg-gray-900 rounded-2xl shadow-md p-6 border border-gray-200 dark:border-gray-700 hover:shadow-xl transition">

                    <div class="flex justify-between items-center">

                        <div>
                            <p class="text-gray-500 dark:text-gray-400 text-sm">
                                Account Type
                            </p>

                            <h2 class="text-2xl font-bold text-purple-600 mt-2"
                                th:text="${loggedInUser.provider}">
                            </h2>
                        </div>

                        <div class="w-16 h-16 rounded-full bg-purple-100 dark:bg-purple-900 flex items-center justify-center">
                            <i class="fa-solid fa-user-shield text-2xl text-purple-600"></i>
                        </div>

                    </div>
                </div>

            </div>

            <!-- Quick Actions -->
            <div class="mt-10">

                <h2 class="text-2xl font-bold text-gray-800 dark:text-white mb-6">
                    Quick Actions
                </h2>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

                    <!-- Add -->
                    <a th:href="@{/user/contacts/add}"
                       class="bg-blue-600 hover:bg-blue-700 text-white rounded-2xl p-6 shadow-lg transition">

                        <div class="flex items-center gap-4">

                            <i class="fa-solid fa-user-plus text-3xl"></i>

                            <div>
                                <h3 class="text-xl font-semibold">
                                    Add Contact
                                </h3>

                                <p class="text-blue-100 text-sm mt-1">
                                    Create a new contact
                                </p>
                            </div>

                        </div>
                    </a>

                    <!-- View -->
                    <a th:href="@{/user/contacts}"
                       class="bg-green-600 hover:bg-green-700 text-white rounded-2xl p-6 shadow-lg transition">

                        <div class="flex items-center gap-4">

                            <i class="fa-solid fa-address-book text-3xl"></i>

                            <div>
                                <h3 class="text-xl font-semibold">
                                    View Contacts
                                </h3>

                                <p class="text-green-100 text-sm mt-1">
                                    Manage all contacts
                                </p>
                            </div>

                        </div>
                    </a>

                    <!-- Profile -->
                    <a th:href="@{/user/profile}"
                       class="bg-purple-600 hover:bg-purple-700 text-white rounded-2xl p-6 shadow-lg transition">

                        <div class="flex items-center gap-4">

                            <i class="fa-solid fa-user text-3xl"></i>

                            <div>
                                <h3 class="text-xl font-semibold">
                                    Your Profile
                                </h3>

                                <p class="text-purple-100 text-sm mt-1">
                                    Account details
                                </p>
                            </div>

                        </div>
                    </a>

                </div>

            </div>

        </div>
    </div>
</div>

<script>
    console.log("Dashboard page");
</script>

<script>
    console.log("second script");
</script>

</body>
</html>
