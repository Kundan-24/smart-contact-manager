<!DOCTYPE html>
<html lang="en" th:replace="~{base ::parent(~{::#content}, ~{::title},~{::script})}">
  <head>
    <title>Update Contact</title>
  </head>
  <body> 
        <div id="content">
            <!-- sidebar -->
            <!-- is user logged in : sidebar -->
            <div th:if="${loggedInUser}">
                <div th:replace="~{user/sidebar :: sidebar}"></div>
            </div>

            <div class="sm:pl-64 min-h-screen p-4">
                <div class="grid grid-cols-12">
                    <div class="hidden md:block md:col-span-3"></div>
                    <div class="col-span-12 md:col-span-6">
                        <div class="card bg-white dark:bg-gray-900 p-6 border border-gray-200 dark:border-gray-700 rounded-xl shadow-lg hover:shadow-2xl transition duration-300">
                            <div th:replace="~{message::messagebox}"></div>  
                            <h1 class="text-2xl font-semibold text-gray-800 dark:text-gray-100"> Update Contact </h1>
                            <!-- Form started -->
                            <form class="mt-8" th:action="@{'/user/contacts/update/' + ${id}}" th:object="${contactsForm}" enctype="multipart/form-data" method="post" >
                                <!-- contact name -->
                                <div class="mb-3">
                                    <label for="name" class="block mb-2.5 text-sm font-medium text-heading">Contact Name</label>
                                    <div class="relative mb-1">
                                        <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
                                            <i class="fa-solid fa-user w-4 h-4 text-gray-500 dark:text-gray-300"></i>            
                                        </div>
                                        <input th:field="*{name}" type="text" autocomplete="name" class="block w-full ps-9 pe-3 py-2.5 bg-white dark:bg-gray-800 border
                                        border-gray-300 dark:border-gray-600 text-gray-800 dark:text-gray-100 text-sm rounded-base focus:ring-blue-500 focus:border-blue-500 shadow-sm
                                        placeholder-gray-400 dark:placeholder-gray-500" placeholder="name">          
                                    </div>
                                    <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-red-500"></p>              
                                </div>

                                <!-- contact email -->
                                <div class="mb-3">
                                    <label for="email" class="block mb-2.5 text-sm font-medium text-heading">Contact email</label>
                                    <div class="relative">
                                        <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
                                            <i class="fa-solid fa-envelope w-4 h-4 text-gray-500 dark:text-gray-300"></i>        
                                        </div>
                                        <input th:field="*{email}" type="text"  autocomplete="email" class="block w-full ps-9 pe-3 py-2.5 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 text-gray-800 dark:text-gray-100 text-sm rounded-base focus:ring-blue-500 focus:border-blue-500 shadow-sm placeholder-gray-400 dark:placeholder-gray-500" placeholder="scm@gmail.com">          
                                    </div>
                                    <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-red-500"></p>            
                                </div>

                                <!-- contact phone number -->
                                <div class="mb-3">
                                    <label for="phoneNumber" class="block mb-2.5 text-sm font-medium text-heading">Contact Phone</label>
                                    <div class="relative">
                                        <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
                                            <i class="fa-solid fa-phone w-4 h-4 text-gray-500 dark:text-gray-300"></i>         
                                        </div>
                                        <input th:field="*{phoneNumber}" type="tel" class="block w-full ps-9 pe-3 py-2.5 bg-white dark:bg-gray-800 border
                                        border-gray-300 dark:border-gray-600 text-gray-800 dark:text-gray-100 text-sm rounded-base focus:ring-blue-500
                                        focus:border-blue-500 shadow-sm placeholder-gray-400 dark:placeholder-gray-500" placeholder="number">          
                                    </div>
                                    <p th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}" class="text-red-500"> </p>              
                                </div>

                                <!-- address -->
                                <div class="mb-3">            
                                    <label for="address" class="block mb-2.5 text-sm font-medium text-heading">Contact Address</label>
                                    <textarea th:field="*{address}"  rows="3" class="block w-full px-3 py-2.5 bg-white dark:bg-gray-800 border
                                        border-gray-300 dark:border-gray-600 text-gray-800 dark:text-gray-100 text-sm rounded-base focus:ring-blue-500
                                        focus:border-blue-500 shadow-sm placeholder-gray-400 dark:placeholder-gray-500" placeholder="Write your address here...">
                                    </textarea>
                                    <p th:if="${#fields.hasErrors('address')}" th:errors="*{address}" class="text-red-500"></p>                
                                </div>

                                <!-- contact discription -->
                                <div class="mb-3">            
                                    <label for="description" class="block mb-2.5 text-sm font-medium text-heading">Contact Description</label>
                                    <textarea th:field="*{description}"  rows="3" class="block w-full px-3 py-2.5 bg-white dark:bg-gray-800 border border-gray-300
                                        dark:border-gray-600 text-gray-800 dark:text-gray-100 text-sm rounded-base focus:ring-blue-500 focus:border-blue-500 shadow-sm 
                                        placeholder-gray-400 dark:placeholder-gray-500" placeholder="Write about your contact...">
                                    </textarea>
                                </div>

                                <!-- social-links -->
                                <div class="flex flex-col md:flex-row gap-3 mb-3">
                                    <div class="w-full">
                                        <!-- website link -->
                                        <div class="mb-3">
                                            <div class="relative">
                                                <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
                                                    <i class="fa-solid fa-earth-americas w-4 h-4 text-gray-500 dark:text-gray-300"></i>         
                                                </div>
                                                <input th:field="*{websiteLink}" type="text" class="block w-full ps-9 pe-3 py-2.5 bg-white dark:bg-gray-800 border
                                                border-gray-300 dark:border-gray-600 text-gray-800 dark:text-gray-100 text-sm rounded-base focus:ring-blue-500 focus:border-blue-500 
                                                shadow-sm placeholder-gray-400 dark:placeholder-gray-500" placeholder="http://scm.com">          
                                            </div>
                                        </div>
                                    </div>

                                    <div class="w-full">
                                        <!-- LinkedIn link -->
                                        <div class="mg-3">
                                            <div class="relative">
                                                <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
                                                    <i class="fa-brands fa-linkedin w-4 h-4 text-gray-500 dark:text-gray-300"></i>      
                                                </div>
                                                <input th:field="*{linkedInLink}" type="text" class="block w-full ps-9 pe-3 py-2.5 bg-white dark:bg-gray-800 border
                                                border-gray-300 dark:border-gray-600 text-gray-800 dark:text-gray-100 text-sm rounded-base focus:ring-blue-500 focus:border-blue-500 
                                                shadow-sm placeholder-gray-400 dark:placeholder-gray-500" placeholder="http://linkedin.com">          
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <!-- image -->
                                <div class="mb-3">
                                    <label class="block mb-2.5 text-sm font-medium text-heading" for="large_size">Contact Image</label>
                                    <input th:field="*{contactImage}" id="image_file_input" type="file" 
                                    class="block w-full text-sm text-gray-900 dark:text-gray-300 border border-gray-300 dark:border-gray-600 rounded-lg cursor-pointer bg-white
                                    dark:bg-gray-800 focus:outline-none file:mr-4 file:py-2 file:px-4 file:rounded-l-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-600
                                    file:text-white hover:file:bg-blue-700dark:file:bg-gray-700 dark:file:text-white">
                                    <img th:src="*{picture}" id="upload_image_preview" class="w-40 mt-2 rounded">
                                </div>

                                <!-- favourite check box -->
                                <div class="flex items-center mb-4">
                                    <input th:field="*{favorite}"  type="checkbox" class="w-4 h-4 text-blue-600 bg-white dark:bg-gray-800 border border-gray-300
                                    dark:border-gray-600 rounded focus:ring-2 focus:ring-blue-500 dark:focus:ring-blue-600">                   
                                    <label for="default-checkbox" class="select-none ms-2 text-sm font-medium text-heading">is this contact is your favourite one ?</label>
                                </div>

                                <!-- Button -->
                                <div class="button-container text-center space-x-2">
                                    <button type="submit" class="px-3 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded">Update Contact</button>
                                    <button type="reset" class="px-3 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded">Reset</button>
                                </div>
                            </form>
                        </div>
                    </div>   
                </div>
            </div>
        </div>

      <script th:src="@{'/js/admin.js'}"></script>
      <script>
        console.log("AddContact page");
      </script>
      <script>
        console.log("second script");
      </script>
  </body>
</html>
