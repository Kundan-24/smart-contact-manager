<!DOCTYPE html>
<html lang="en"
      th:replace="~{base :: parent(~{::#content}, ~{::title}, ~{::script})}">

<head>
    <title>Email Verified</title>
</head>

<body>

<div id="content"
     class="pt-20 min-h-[85vh]
     bg-gray-50 dark:bg-gray-950
     font-sans">

    <!-- CENTER WRAPPER (same as signup style) -->
    <div class="grid grid-cols-12">

        <div class="col-span-12 md:col-span-2 lg:col-span-3"></div>

        <!-- MAIN CARD -->
        <div class="col-span-12 md:col-span-8 lg:col-span-6">

            <div
                class="mt-6 p-8 md:p-10
                bg-white dark:bg-gray-800
                border-t-8 border-green-600
                rounded-2xl shadow-lg
                text-center transition-all duration-300">

                <!-- ICON -->
                <div class="flex justify-center mb-6">

                    <div
                        class="w-20 h-20 rounded-full
                        bg-green-100 dark:bg-green-900/30
                        flex items-center justify-center">

                        <svg class="w-10 h-10 text-green-600 dark:text-green-400"
                             fill="none"
                             stroke="currentColor"
                             stroke-width="3"
                             viewBox="0 0 24 24">

                            <path stroke-linecap="round"
                                  stroke-linejoin="round"
                                  d="M5 13l4 4L19 7"/>
                        </svg>

                    </div>

                </div>

                <!-- TITLE -->
                <h1
                    class="text-2xl md:text-3xl font-bold
                    text-gray-900 dark:text-white">

                    Email Verified Successfully
                </h1>

                <!-- SUBTEXT -->
                <p
                    class="mt-3 text-gray-600 dark:text-gray-300">

                    Your account is now active. You can login and start using Smart Contact Manager.
                </p>

                <!-- MESSAGE -->
                <div class="mt-5">
                    <div th:replace="~{message :: messagebox}"></div>
                </div>

                <!-- BUTTONS -->
                <div class="mt-8 flex justify-center gap-3">

                    <a th:href="@{/login}"
                       class="px-5 py-2 rounded-lg
                       bg-green-600 hover:bg-green-700
                       text-white font-semibold
                       transition">

                        Login
                    </a>

                    <a th:href="@{/home}"
                       class="px-5 py-2 rounded-lg
                       bg-gray-700 hover:bg-gray-800
                       text-white font-semibold
                       transition">

                        Home
                    </a>

                </div>

            </div>

        </div>

        <div class="col-span-12 md:col-span-2 lg:col-span-3"></div>

    </div>

</div>

<script>
    console.log("clean success page loaded");
</script>

</body>
</html>
