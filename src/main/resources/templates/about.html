<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aboutpage</title>
</head>
<body>
     <h1>This is aboutpage</h1>
     <hr/>
    <!-- using fragement -->
     <div class="host-tag" th:replace="${isLogin} ? ~{base :: parent(~{::section})} : ~{base :: test(~{:: #not_logged_in})}">
       <section>
        <h1>User is Login</h1>
        <h1>This is Dynamic content</h1>
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Suscipit maiores quam reiciendis! Ab qui totam sequi non aperiam eum temporibus.</p>
        <button>Click on Dynamic content</button>
       </section>

       <section id="not_logged_in">
        <h1>User is not Login</h1>
       </section>
     </div>
     
</body>
</html>
